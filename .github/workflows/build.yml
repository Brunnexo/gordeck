#
# Builds and tests Gordeck on the main Linux distributions and builds the
# Flatpak, which runs on any distribution (including SteamOS).
# Pushing a tag like v2.1.1 publishes a GitHub release with all packages.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # new pushes to a pull request replace its running build,
  # builds of main and of tags always run to the end
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            image: ubuntu:24.04
          - name: Debian 12
            image: debian:12
          - name: Fedora 41
            image: fedora:41
          - name: Arch Linux
            image: archlinux:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build, test and package
        run: bash .github/scripts/build-native.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ strategy.job-index }}
          path: dist/*
          if-no-files-found: ignore

  flatpak:
    name: Flatpak (all distributions)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Allow the flatpak-builder sandbox
        # Ubuntu 24.04 restricts unprivileged user namespaces, which bubblewrap needs
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install Flatpak and the KDE SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.kde.Sdk//5.15-25.08 org.kde.Platform//5.15-25.08

      - name: Cache flatpak-builder
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('flatpak-build.yaml') }}-${{ github.sha }}
          restore-keys: flatpak-builder-${{ hashFiles('flatpak-build.yaml') }}-

      - name: Build Flatpak and installer package
        run: FLATPAK_BUILDER=flatpak-builder ./installer/build-package.sh

      - name: Upload Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: |
            dist/Gordeck-Instalador/gordeck.flatpak
            dist/Gordeck-Instalador.tar.gz

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Downloads

            | Arquivo | Para |
            |---|---|
            | `Gordeck-Instalador.tar.gz` | **Steam Deck**: instalador gráfico, adiciona o Gordeck à biblioteca da Steam |
            | `gordeck.flatpak` | Qualquer distribuição Linux (`flatpak install --user gordeck.flatpak`) |
            | `gordeck-*-ubuntu-24.04-*.deb` | Ubuntu 24.04 e derivados |
            | `gordeck-*-debian-12-*.deb` | Debian 12 |
            | `gordeck-*-fedora-41-*.rpm` | Fedora 41 |

<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4fa8"/>
      <stop offset="0.6" stop-color="#0b1a38"/>
      <stop offset="1" stop-color="#060b16"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="230" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f8cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2f8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="letter" x1="0" y1="96" x2="0" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9c6dd"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="186" x2="0" y2="326" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fd0ff"/>
      <stop offset="1" stop-color="#2f8cff"/>
    </linearGradient>
  </defs>

  <!-- app tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#background)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="110.5" fill="none" stroke="#6cb4ff" stroke-opacity="0.35" stroke-width="3"/>

  <!-- the "G": a ring open at the top right, ending in a short crossbar -->
  <path d="M 360.7 151.3 A 148 148 0 1 0 404 256 L 352 256"
        fill="none" stroke="url(#letter)" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- play button inside the G -->
  <path d="M 212 196 L 212 316 Q 212 330 224 323 L 300 263 Q 310 256 300 249 L 224 189 Q 212 182 212 196 Z"
        fill="url(#play)"/>
</svg>
